<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recurring | Chapaa Hub</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="app"><aside class="sidebar"></aside><main class="main-content"><header class="topbar"><div class="page-title"><p class="kicker">AUTOMATE THE BORING STUFF</p><h1>Recurring</h1><p>Keep track of subscriptions, bills and regular income.</p></div><div class="topbar-actions"><button class="primary-btn" id="new-recurring"><i class="fa-solid fa-plus"></i><span>Add recurring</span></button></div></header><section class="section"><div class="card panel"><div class="table-wrap"><table class="professional-table"><thead><tr><th>Description</th><th>Category</th><th>Type</th><th>Frequency</th><th>Next run</th><th>Status</th><th></th></tr></thead><tbody id="recurring-table"></tbody></table></div></div></section></main></div><div class="modal-backdrop" id="recurring-modal"><div class="modal"><div class="modal-head"><div><h2>Recurring transaction</h2><p>Store the schedule for a regular money movement.</p></div><button class="modal-close" data-close-modal="recurring-modal">×</button></div><form id="recurring-form"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label>DESCRIPTION</label><input name="description" required></div><div class="field"><label>AMOUNT</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>CATEGORY</label><select name="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Personal</option><option>Other</option></select></div><div class="field"><label>TYPE</label><select name="transaction_type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>FREQUENCY</label><select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="yearly">Yearly</option></select></div><div class="field"><label>NEXT RUN</label><input name="next_run" type="date" required></div><div class="field"><label>ACTIVE</label><select name="active"><option value="true">Active</option><option value="false">Paused</option></select></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal="recurring-modal">Cancel</button><!-- BUTTON: Create or update recurring transaction --><button class="primary-btn">Save schedule</button></div></form></div></div><div id="toast" class="toast"></div><script src="/js/global.js"></script><script src="/js/recurring.js"></script></body></html>
