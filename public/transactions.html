<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | Chapaa Hub</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="app"><aside class="sidebar"></aside><main class="main-content"><header class="topbar"><div class="page-title"><p class="kicker">MONEY MOVEMENT</p><h1>Transactions</h1><p>Every inflow and outflow, in one clean timeline.</p></div><div class="topbar-actions"><button class="primary-btn" id="open-add"><i class="fa-solid fa-plus"></i><span>Add transaction</span></button></div></header><section class="section"><div class="card panel"><div class="toolbar" style="display:grid;grid-template-columns:1fr 170px 150px;gap:9px;margin-bottom:16px"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search description or category"></div><select id="category" class="field input"><option>All Categories</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Personal</option><option>Education</option><option>Health</option><option>Other</option><option>Income</option></select><select id="type"><option>All Types</option><option>Income</option><option>Expense</option></select></div><div class="table-wrap"><table class="professional-table"><thead><tr><th>Transaction</th><th>Category</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="table-body"></tbody></table></div></div></section></main></div><div class="modal-backdrop" id="tx-modal"><div class="modal"><div class="modal-head"><div><h2 id="modal-title">Add transaction</h2><p>Changes automatically update your account balance.</p></div><button class="modal-close" data-close-modal="tx-modal">×</button></div><form id="tx-form"><input type="hidden" name="id"><div class="form-grid"><div class="field"><label>TYPE</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>CATEGORY</label><select name="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Personal</option><option>Education</option><option>Health</option><option>Other</option></select></div><div class="field full"><label>DESCRIPTION</label><input name="description" required></div><div class="field"><label>AMOUNT</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>DATE</label><input name="date" type="date"></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal="tx-modal">Cancel</button><!-- BUTTON: Save transaction changes --><button class="primary-btn">Save transaction</button></div></form></div></div><div class="modal-backdrop" id="delete-modal"><div class="modal"><div class="modal-head"><div><h2>Delete transaction?</h2><p>This cannot be undone and the balance will be recalculated.</p></div><button class="modal-close" data-close-modal="delete-modal">×</button></div><input type="hidden" id="delete-id"><div class="modal-actions"><button class="secondary-btn" data-close-modal="delete-modal">Keep it</button><!-- BUTTON: Permanently delete transaction --><button class="danger-btn" id="confirm-delete">Delete transaction</button></div></div></div><div id="toast" class="toast"></div><script src="/js/global.js"></script><script src="/js/transactions.js"></script></body></html>
