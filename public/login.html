<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Register</title>
<link rel="stylesheet" href="/css/login.css">
  </head>
  <body>
    <div class="card">
      <!-- Tab navigation -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">
          Login
        </button>
        <button class="tab-btn" onclick="switchTab('register')">
          Register
        </button>
      </div>

      <!-- Login Form -->
      <form
        id="form-login"
        class="form-content active"
        action="/auth/login"
        method="post"
      >
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            required name="email"
            placeholder="you@example.com"
          />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            required name="password"
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn">Log In</button>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="form-content" action="/auth/register" method="POST">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required name="username"  placeholder="Jane Doe" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input
            type="email"
            id="reg-email"
            required name="email"
            placeholder="you@example.com"
          />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input
            type="password"
            id="reg-password"
            required name="password"
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn">Create Account</button>
      </form>
    </div>

    <script src="/js/login.js"></script>
    <script src="/js/global.js"></script>
  </body>
</html>
