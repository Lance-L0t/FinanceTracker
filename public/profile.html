<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Chapaa Hub</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="app"><aside class="sidebar"></aside><main class="main-content"><header class="topbar"><div class="page-title"><p class="kicker">YOUR IDENTITY</p><h1>Profile</h1><p>Keep your account details up to date.</p></div></header><section class="section"><div class="dashboard-grid"><div class="card panel"><div class="panel-head"><div><h3>Personal details</h3><span class="muted">These details identify your account.</span></div></div><form id="profile-form"><div class="field" style="margin-bottom:12px"><label>USERNAME</label><input name="username" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="modal-actions"><!-- BUTTON: Save profile information --><button class="primary-btn">Save profile</button></div></form></div><div class="card panel"><div class="panel-head"><div><h3>Change password</h3><span class="muted">Use a strong password you do not reuse elsewhere.</span></div></div><form id="password-form"><div class="field" style="margin-bottom:12px"><label>CURRENT PASSWORD</label><input name="currentPassword" type="password" required></div><div class="field"><label>NEW PASSWORD</label><input name="newPassword" type="password" minlength="6" required></div><div class="modal-actions"><!-- BUTTON: Change account password --><button class="primary-btn">Update password</button></div></form></div></div></section></main></div><div id="toast" class="toast"></div><script src="/js/global.js"></script><script src="/js/profile.js"></script></body></html>
