<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budgets | Chapaa Hub</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="app"><aside class="sidebar"></aside><main class="main-content"><header class="topbar"><div class="page-title"><p class="kicker">SPENDING PLAN</p><h1>Budgets</h1><p>Give every category a limit before it gets a chance to run wild.</p></div><div class="topbar-actions"><button class="primary-btn" id="new-budget"><i class="fa-solid fa-plus"></i><span>Create budget</span></button></div></header><section class="section"><div class="stats-grid"><div class="card stat-card"><p class="stat-label">MONTHLY BUDGET</p><h2 class="stat-value" id="budget">KSh 0</h2></div><div class="card stat-card"><p class="stat-label">SPENT</p><h2 class="stat-value" id="spent">KSh 0</h2></div><div class="card stat-card"><p class="stat-label">REMAINING</p><h2 class="stat-value" id="remaining">KSh 0</h2></div><div class="card stat-card"><p class="stat-label">DAYS LEFT</p><h2 class="stat-value" id="days-left">0</h2></div></div></section><section class="section"><div class="section-title"><div><h2>Category budgets</h2><p>Live spending is calculated from this month's transactions.</p></div></div><div class="cards-grid" id="budget-grid"></div></section></main></div><div class="modal-backdrop" id="budget-modal"><div class="modal"><div class="modal-head"><div><h2>Create budget</h2><p>Set a monthly limit for one spending category.</p></div><button class="modal-close" data-close-modal="budget-modal">×</button></div><form id="budget-form"><input type="hidden" name="id"><div class="form-grid"><div class="field"><label>CATEGORY</label><select name="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Personal</option><option>Education</option><option>Health</option><option>Other</option></select></div><div class="field"><label>MONTHLY LIMIT</label><input name="limit_amount" type="number" min="1" step="0.01" required></div><div class="field full"><label>MONTH</label><input name="month" type="month"></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal="budget-modal">Cancel</button><!-- BUTTON: Create or update a category budget --><button class="primary-btn">Save budget</button></div></form></div></div><div id="toast" class="toast"></div><script src="/js/global.js"></script><script src="/js/budget.js"></script></body></html>
